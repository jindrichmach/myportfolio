version: 2
updates:
  - package-ecosystem: composer
    directory: /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # TypeScript 7 (nativní kompilátor) zatím vue-tsc nepodporuje; @types/node drží verzi Node v Dockerfile (LTS)
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # jen LTS verze Node (sudé) — přechod na další LTS ručně
      - dependency-name: node
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
